<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UE Castelldefels Cadete B Primera División: Rendimiento colectivo y Plan para Ganar la Liga</title>
<meta name="description" content="UE Castelldefels Cadete B Primera División (Grupo 13): datos de actas FCF, juego colectivo, plan y estudio del rival.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00007E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadete B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>/* Identidad visual: azul y amarillo de la UE Castelldefels */
:root{--navy:#00007E;--navy-d:#000058;--navy-t:#E8EAF8;--yel:#FFFF1A;--yel-ui:#F5D000;--yel-t:#FFF9C4;--red:#D7262E;
  --ink:#14163A;--mut:#5A5D78;--bd:#DCDDEA;--bg:#F3F4FA}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
.page{max-width:900px;margin:0 auto;padding:0 16px 40px}
a{color:var(--navy)}
/* Cabecera */
.hero{background:radial-gradient(120% 140% at 100% 0%,#1a1aa8 0%,var(--navy) 45%,var(--navy-d) 100%);color:#fff;margin:0 -16px 22px;padding:24px 22px 22px;position:relative;border-bottom:6px solid var(--yel)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.crest{width:64px;height:64px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.club{color:var(--yel);font-weight:800;font-size:22px;letter-spacing:.3px;line-height:1.1;text-transform:uppercase}
.team{color:#D6D9F5;font-size:14px;font-weight:500;margin-top:3px}
.hero h1{margin:4px 0 8px;font-size:clamp(22px,4.4vw,31px);line-height:1.18;font-weight:750;letter-spacing:-.2px}
.summary{color:#D6D9F5;margin:0 0 16px;max-width:760px}
.downloads{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;text-decoration:none;font-weight:700;font-family:inherit}
.btn.primary{background:var(--yel);border-color:var(--yel);color:var(--navy)}
.hero .btn.primary{box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:hover{filter:brightness(.96)}
.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--yel-ui);outline-offset:2px}
/* Secciones */
.sec{scroll-margin-top:12px}
.sec.d0{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:20px 20px 8px;margin:0 0 18px;box-shadow:0 1px 2px rgba(0,0,40,.04)}
.sec.d1,.sec.d2{margin:20px 0 6px}
.sechead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h2.h{font-size:21px;margin:0;color:var(--navy);font-weight:780;letter-spacing:-.2px;padding-bottom:4px;background:linear-gradient(var(--yel-ui),var(--yel-ui)) left bottom/44px 4px no-repeat}
h3.h{font-size:17px;margin:0;color:var(--navy);font-weight:700}
.chev{display:inline-block;width:18px;color:var(--mut)}
.caption{color:var(--mut);font-size:13.5px;margin:-2px 0 10px}
.blocks>*{margin:0 0 14px}
.text{margin:0 0 12px}
.callout{background:var(--yel-t);border-left:5px solid var(--yel-ui);padding:12px 14px;border-radius:10px}
.callout strong{display:block;margin-bottom:4px;color:var(--navy)}
/* Tablas */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--bd)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:650;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #EEF0F6;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:#F8F9FD}
td.em{font-weight:650;color:var(--navy)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;margin-left:6px;background:var(--navy-t);color:var(--navy)}
td .pill{margin-left:0}
.pill.success{background:#DDF2E1;color:#1B5E20}.pill.warning{background:#FFF3B8;color:#6B5200}.pill.danger{background:#F9D6D9;color:#8E0F1E}
/* Fichas y filas */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;border:1px solid var(--bd);border-left:4px solid var(--yel-ui);border-radius:10px;padding:10px 12px;background:#fff}
.lead{flex:0 0 auto;min-width:38px;height:38px;border-radius:19px;background:var(--navy);color:var(--yel);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0 6px}
.rbody{flex:1;min-width:0}.rtitle{font-weight:680;color:var(--ink)}.rmeta{color:var(--mut);font-size:13px}.rdetail{font-size:14.5px;margin-top:2px}
.list{margin:0 0 12px;padding-left:22px}.list li{margin:0 0 6px}.list li::marker{color:var(--navy);font-weight:700}
.list.pro li::marker{content:"+  ";color:#1B7F3B}.list.con li::marker{content:"−  ";color:var(--red)}
.steps{list-style:none;padding:0;margin:0}.steps li{display:flex;gap:10px;margin:0 0 10px}
.steps .n{flex:0 0 26px;height:26px;border-radius:13px;background:var(--navy);color:var(--yel);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.steps b{color:var(--navy)}.sd{color:#33354F;font-size:14.5px}
.props{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:6px 14px;margin:0}
.props dt{font-weight:650;color:var(--navy)}.props dd{margin:0}
/* Indicadores */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric{border:1px solid var(--bd);border-top:5px solid var(--yel-ui);border-radius:12px;padding:12px 14px;background:linear-gradient(180deg,#fff 0%,#FAFAFE 100%)}
.mv{font-size:28px;font-weight:800;line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums}.ml{font-weight:650;font-size:14px}.md{color:var(--mut);font-size:13px}
/* Índice */
.toc{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px 20px;margin:0 0 18px}
.toct{font-weight:780;margin-bottom:6px;color:var(--navy)}.toc ol{margin:0;padding-left:22px;columns:2;column-gap:28px}.toc li{margin:0 0 4px;break-inside:avoid}
.toc li::marker{color:var(--mut)}.toc li.sub{list-style:circle;margin-left:14px}.toc a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--bd)}.toc a:hover{color:var(--navy);border-color:var(--yel-ui)}
/* Pestañas */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--navy-t);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--navy);font-family:inherit;font-weight:600}
.seg button.on{background:var(--navy);color:var(--yel);box-shadow:0 1px 3px rgba(0,0,60,.25)}
/* Rejilla y gráficos */
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px}
.grid>.sec{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0;background:#fff}
.proscons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pc{border:1px solid var(--bd);border-radius:12px;padding:12px}
.pc b{color:var(--navy)}.pc.pro{border-top:4px solid #2E7D32}.pc.con{border-top:4px solid var(--red)}.pc ul{margin-top:6px}
.bars{display:flex;flex-direction:column;gap:8px}
.bl{font-size:14px;font-weight:650}.bm{font-weight:400;color:var(--mut);font-size:12.5px;margin-left:6px}
.bt{display:flex;align-items:center;gap:8px}.bf{height:14px;background:linear-gradient(90deg,var(--navy),#2B2BB0);border-radius:7px;min-width:4px}.bd{font-size:13px;font-weight:700;white-space:nowrap;color:var(--navy)}
.bar:hover .bf{background:var(--yel-ui)}
.chart .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-bottom:4px}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg{max-width:620px;display:block}
svg text{font-family:inherit}
.sec.d1>.blocks{overflow-x:auto}
.blocks>svg[aria-label^="Resultados"]{min-width:540px}
/* Pie */
.foot{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mut);font-size:13px;padding:18px 0 8px;border-top:3px solid var(--yel-ui);margin-top:10px}
.foot img{width:28px;height:28px}
@media (max-width:700px){.grid,.proscons{grid-template-columns:1fr}.toc ol{columns:1}.sec.d0{padding:16px 13px 4px}body{font-size:15px}
  .props{grid-template-columns:1fr}.props dt{margin-top:6px}.crest{width:52px;height:52px}.club{font-size:18px}.hero{padding:20px 16px 18px}}
@media print{.downloads,.seg{display:none}.hero{background:var(--navy)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* Navegación Nuestro equipo / Rivales y bloques del próximo rival */
#vista{position:sticky;top:0;z-index:20;padding:10px 14px;display:flex;justify-content:center}
#vista .seg button{font-size:16px;padding:9px 22px}
#acceso-rival,#proximo-rival{border:2px solid var(--navy);border-left:10px solid var(--yel-ui);background:#FFFBE0}
/* ===== Capa visual (maqueta) ===== */
body{background:#F5F6FB}
#vista{position:sticky;top:0;z-index:20;background:rgba(245,246,251,.94);backdrop-filter:blur(8px);margin:0 -16px 14px;padding:10px 16px 8px;border:0;box-shadow:0 1px 0 var(--bd)}
#vista .blocks>*{margin:0}
#vista .seg{display:grid;grid-template-columns:repeat(3,1fr);background:#E3E5F3;border-radius:999px;padding:4px;gap:4px}
#vista .seg button{border:0;border-radius:999px;padding:9px 6px;font-weight:700;font-size:14px;background:transparent;color:var(--navy)}
#vista .seg button.on{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(0,0,80,.25)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;font-size:12.5px;font-weight:600;color:var(--navy);background:#fff;border:1px solid var(--bd);border-radius:999px;padding:5px 11px;text-decoration:none}
.jump a:active,.jump a:hover{background:var(--yel-ui);border-color:var(--yel-ui)}
.sec{scroll-margin-top:110px}
.sec.d0{border-radius:18px;border:1px solid #E3E5F0;box-shadow:0 2px 10px rgba(0,0,60,.05)}
h2.h{display:flex;align-items:center;gap:10px;background:none;padding:0}
.ico{flex:none;width:34px;height:34px;padding:7px;border-radius:10px;background:var(--navy);fill:none;stroke:var(--yel-ui);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.metrics{gap:10px}.metric{border-radius:14px;border:0;background:linear-gradient(160deg,#fff 0%,#EEF0FA 100%);box-shadow:inset 0 0 0 1px #E3E5F0;position:relative;overflow:hidden}
.metric::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--yel-ui)}
.metric .mv{color:var(--navy);font-size:30px;font-weight:850;letter-spacing:-.02em}
.spark{background:#fff;border:1px solid #E3E5F0;border-radius:14px;padding:12px 14px;margin-top:10px}
.spk-h{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--mut)}.spk-h span{margin-right:6px}
.chip{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:12px;font-weight:800}
.chip.V{background:#DDF2E1;color:#1B5E20}.chip.E{background:#FFF3CC;color:#6B5200}.chip.D{background:#F9D9DC;color:#8E0F1E}
.spk-n{font-size:12px;color:var(--mut)}
.vs{display:grid;gap:12px;margin-bottom:12px}.vs div{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}
.vs b{font-size:28px;color:var(--navy);grid-row:span 2}.vs span{font-size:13px;color:var(--mut)}
.vs i{display:block;height:8px;border-radius:99px;background:#1B7F3B;grid-column:2}.vs i.neg{background:#D7262E}.vs em{grid-column:2;font-style:normal;font-size:12px;color:var(--mut)}
.plancard{background:var(--navy);color:#fff;border-radius:18px;padding:20px;margin:0 0 18px;box-shadow:0 6px 18px rgba(0,0,80,.18);scroll-margin-top:110px}
.pc-k{color:var(--yel-ui);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.pc-t{font-size:19px;font-weight:700;line-height:1.3;margin:6px 0 12px}
.pc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.pc-chips span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;font-size:13px}
.pc-n{font-size:12px;opacity:.7;margin-top:8px}
.pill.success{background:#DDF2E1;color:#1B5E20}.pill.danger{background:#F9D9DC;color:#8E0F1E}
.steps li .n{background:var(--yel-ui);color:var(--navy)}
.soon{display:inline-block;background:var(--yel-t);color:#6B5200;border:1px dashed var(--yel-ui);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;margin:0 0 14px}
.pitch{width:100%;max-width:340px;display:block;margin:0 auto 8px}
.bar .bf{background:linear-gradient(90deg,var(--navy),#3B3BC4)}
@media (min-width:900px){#vista{margin:0 0 16px;border-radius:0 0 14px 14px}}
#vista,#vista .blocks{min-width:0;max-width:100vw;overflow:hidden}#vista .blocks{display:block}.jump{max-width:100%}
.sec svg:not([aria-label^="Resultados"]){max-width:100%;height:auto}.blocks:has(>svg[aria-label^="Resultados"]){overflow-x:auto;-webkit-overflow-scrolling:touch}
.cover{background:#00007E;color:#fff;min-height:100svh;margin:0 -16px;padding:28px 22px 26px;display:flex;flex-direction:column;gap:18px}
.cv-k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.cv-h{font-size:clamp(34px,9vw,58px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:auto 0 0}
.cv-pos{display:flex;align-items:baseline;gap:12px}.cv-pos span{font-size:clamp(100px,32vw,170px);font-weight:900;line-height:.9;color:#F5D000}.cv-pos em{font-style:normal;font-size:16px;opacity:.8}
.cv-next{border-top:1px solid rgba(255,255,255,.25);padding-top:16px}.cv-nl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}.cv-nv{font-size:24px;font-weight:700}.cv-nd{opacity:.85}
.cv-down{color:#F5D000;text-decoration:none;font-weight:700;margin-top:auto}
.hero{scroll-margin-top:0}
@media(min-width:900px){.cover{min-height:auto;padding:60px 48px 52px;margin:0}.cv-h{margin:28px 0 0;max-width:780px}}
</style></head>

2, J6 y J7).","Sin bal\xF3n: 4-4-2 o 4-1-4-1 en bloque medio (J4, J6 y J7)."]})}),(0,u.jsx)(j,{heading:"Presi\xF3n y altura del bloque",children:(0,u.jsx)(se,{items:["Contra rivales que dejan jugar, presi\xF3n alta y contrapresi\xF3n inmediata: en J2, 65-80 % de posesi\xF3n y 21 tiros a 6.","La presi\xF3n sobre el portero rival tras un pase atr\xE1s dio el gol de J4: despeje bloqueado y bal\xF3n suelto.","Contra rivales con m\xE1s bal\xF3n (J4, J6), bloque medio y posesi\xF3n repartida (45-55 %).","Con ventaja, el bloque baja demasiado: en el tramo final de J2 (30-35 % de posesi\xF3n) y de J6 (15-20 %) se defendi\xF3 muy cerca del \xE1rea propia.","En J4 el rival gan\xF3 a menudo la segunda jugada tras bal\xF3n largo."]})}),(0,u.jsx)(j,{heading:"Salida de bal\xF3n",children:(0,u.jsx)(se,{items:["Salida en corto con el pivote bajando a recibir entre los centrales (J2) y circulaci\xF3n paciente: el 1-0 contra el Prat lleg\xF3 tras 13 pases desde atr\xE1s y un cambio largo a la banda derecha.","Cuando hay espacio se sale en corto; bajo presi\xF3n, en largo (J4, J6).","Contra presi\xF3n alta la salida en corto se rompe: saques de puerta interceptados y errores repetidos en la primera parte de J7 (0 tiros nuestros y 12 del rival) y despejes precipitados al final de J4.","Al inicio de la segunda parte de J7, exceso de balones largos sin destino.","El saque largo desde porter\xEDa a la banda tambi\xE9n genera ventaja: as\xED empez\xF3 el 2-1 contra el Prat."]})}),(0,u.jsx)(j,{heading:"Ocupaci\xF3n de espacios y amplitud",children:(0,u.jsx)(se,{items:["Amplitud por las dos bandas: en J2, J4 y J7 predominan las conducciones y centros por la izquierda; contra el Prat, 3 de los 4 goles llegaron por la derecha, y en la primera parte de J6 se atac\xF3 sobre todo por la derecha.","Finalizaci\xF3n repetida: pase atr\xE1s raso desde la l\xEDnea de fondo y remate de primeras en el centro del \xE1rea, cerca del punto de penalti (J2, J5, J6 y clips de partidos en casa).","Llegada de segunda l\xEDnea: el 3-1 contra el Prat, de media volea desde fuera del \xE1rea tras un despeje.","Ataque al rechace: en los clips de partidos en casa, dos goles llegan de rechaces tras una parada del portero rival."]})}),(0,u.jsx)(j,{heading:"Transiciones",children:(0,u.jsx)(se,{items:["Ataque r\xE1pido: contra de 10 segundos desde nuestro tercio (robo por la izquierda, cambio a la derecha, centro y remate de cabeza) en el 4-1 contra el Prat.","Bal\xF3n largo a la espalda de la defensa: el 3-1 de J7 (bal\xF3n que bota y uno contra uno) y, en Cubelles, un bal\xF3n largo por encima de la defensa hacia la derecha.","Robo tras presi\xF3n en campo rival: el gol de J4 y ocasiones en la segunda parte de J7.","Transici\xF3n defensiva: los goles en contra vistos nacen de p\xE9rdidas en el centro del campo (J4, J5, J6): pase previsible en campo rival, contra r\xE1pida y l\xEDnea defensiva superada.","Con un lateral adelantado queda espacio a su espalda: por ah\xED lleg\xF3 la jugada del penalti del Prat, con el medio superado y la l\xEDnea defensiva plana.","Rechaces tras parada: el gol en contra visto de J4 y el 0-1 de J7 llegan de un bal\xF3n suelto tras una parada; falt\xF3 seguir a los que llegan desde atr\xE1s."]})}),(0,u.jsx)(j,{heading:"Bal\xF3n parado",children:(0,u.jsx)(se,{items:["Ofensivo: al menos 4 goles de falta lateral o c\xF3rner en los v\xEDdeos, con centro cerrado de pierna derecha y remate, casi siempre de cabeza, alrededor del punto de penalti (2 en J2 y 2 contra un rival de azul claro).","Penaltis a favor: 1 en acta (J3) y el 3-0 de J9; en el v\xEDdeo de J2 se ve otro penalti a favor tras una conducci\xF3n al \xE1rea.","Defensivo: los c\xF3rners en contra de J6 y las faltas laterales del Prat en J5 se despejaron bien; la l\xEDnea defensiva gana muchos duelos a\xE9reos (J2, J6).","2 penaltis en contra (J5 por mano y J6)."]})}),(0,u.jsx)(j,{heading:"Comportamiento por partes",children:(0,u.jsx)(se,{items:["Primera parte: 12 goles a favor y 8 en contra. Segunda parte: 17 a favor y 1 en contra.","En los v\xEDdeos, las primeras partes de J4 y J7 son las m\xE1s dif\xEDciles: el rival gana segundas jugadas o presiona alto y el equipo no encuentra la salida.","Tras el descanso el equipo mejora: m\xE1s presi\xF3n tras p\xE9rdida y m\xE1s llegadas (J5, J7 y J9)."]})}),(0,u.jsx)(j,{heading:"Gesti\xF3n de las ventajas",children:(0,u.jsx)(B,{children:"Con ventaja, el equipo se encierra: baja la posesi\xF3n y salen menos ataques. Mantener una salida por banda o en largo para respirar y no defender tanto tiempo cerca del \xE1rea propia."})})]}),(0,u.jsxs)(j,{heading:"Decisiones y fatiga a lo largo del partido",id:"fatiga",caption:"Apartado fijo: tramos de unos 15 minutos dentro de cada parte (partes de 40'), solo con lo que consta en los an\xE1lisis de v\xEDdeo. Sin dato = no consta.",children:[(0,u.jsx)(B,{children:"J9 en Sant Just. Lo grabado cubre unos 28 de los 40 minutos de cada parte (1\xAA: 0'-28'; 2\xAA: 40'-68' aprox.); los minutos sin grabaci\xF3n se indican. El an\xE1lisis de v\xEDdeo no cuenta p\xE9rdidas en salida: donde no hay dato, se dice."}),(0,u.jsx)(te,{columns:["Tramo","Ocasiones creadas","Ocasiones concedidas","Salida, recuperaci\xF3n e intensidad"],rows:[["1\xAA \xB7 0'-15'","2 (12' y 14', paradas del portero)","1 (7', contra tras p\xE9rdida nuestra en campo rival)","Primeros 10' igualados; desde el 10', dominio. Contrapresi\xF3n inmediata tras p\xE9rdida."],["1\xAA \xB7 15'-30'","4 (16', 19', 21', 25')","0","Dominio total hasta el 25' y control despu\xE9s."],["1\xAA \xB7 30'-40'","Gol del 1-0 (30', no grabado)","Sin grabaci\xF3n","Del 28' al 40' no hay grabaci\xF3n."],["2\xAA \xB7 40'-55'","1 ocasi\xF3n (42') y 2 goles (48' y 55')","0 (solo una falta lejana, ~50')","Presi\xF3n muy alta en los saques de puerta; bajo presi\xF3n, salida en largo."],["2\xAA \xB7 55'-70'","2 ocasiones (58' y 63') y 1 gol (67')","0","Sin ca\xEDda de intensidad en lo grabado (hasta ~68')."],["2\xAA \xB7 70'-80'","Sin grabaci\xF3n","Sin grabaci\xF3n","Sin dato."]]}),(0,u.jsx)(se,{items:["P\xE9rdidas en salida: el an\xE1lisis de v\xEDdeo no las cuantifica; ninguna ocasi\xF3n del rival naci\xF3 de una p\xE9rdida en la salida. Cuando el rival apret\xF3, el equipo sali\xF3 en largo.","Recuperaci\xF3n tras p\xE9rdida: contrapresi\xF3n inmediata en las dos partes y robos en campo medio y rival.","Ocasiones: 6 creadas en la primera parte grabada (sin gol hasta el 30') y 3 m\xE1s los 3 goles en la segunda; concedida solo 1 clara en todo lo grabado (7').","Intensidad al final: no se ve ca\xEDda en lo grabado de la segunda parte; los \xFAltimos 12 minutos de cada parte no est\xE1n grabados, as\xED que el cierre del partido queda sin dato.","Cambios: 4 sustituciones y un cambio de posici\xF3n durante el partido; el acta no recoge el minuto de los cambios."]})]}),(0,u.jsxs)(j,{heading:"Estad\xEDsticas de v\xEDdeo por partido",id:"partidos",caption:"Recuentos sobre lo grabado; son m\xEDnimos y estimaciones, no datos oficiales.",children:[(0,u.jsx)(mr,{labels:["J2 Cubelles","J4 Vilafranca","J6 Cornell\xE0","J7 Blanca S."],series:[{name:"Tiros nuestros",values:[21,7,4,4]},{name:"Tiros del rival",values:[6,10,5,18]}]}),(0,u.jsx)(te,{columns:["Partido","Final","Tiros","Posesi\xF3n"],rows:[["J2 en Cubelles",{text:"1-8 G",tone:"success"},"21-6","65-80 %"],["J4 en Vilafranca",{text:"2-1 P",tone:"danger"},"7-10","45-55 %"],["J5 vs Prat",{text:"4-1 G",tone:"success"},"\u2013","\u2013"],["J6 en Cornell\xE0",{text:"1-2 G",tone:"success"},"4-5","15-55 %"],["J7 vs Blanca Subur",{text:"3-1 G",tone:"success"},"4-18","35-55 %"],["J9 en Sant Just",{text:"0-4 G",tone:"success"},"\u2013","\u2013"]]}),(0,u.jsx)(B,{children:"Tiros: nuestros-rival. Posesi\xF3n: nuestra, por tramo. Recuentos sobre lo grabado (24-28 minutos por parte); son m\xEDnimos y estimaciones, no datos oficiales. J5 solo tiene clips de goles y tramos de la segunda parte. En J9 se anotaron ocasiones, no tiros ni posesi\xF3n (ver Decisiones y fatiga)."}),(0,u.jsxs)(j,{heading:"J5 vs Prat: c\xF3mo fueron los goles",children:[(0,u.jsx)(te,{columns:["Gol","Construcci\xF3n","Fase del juego"],rows:[["1-0 (11')","13 pases desde atr\xE1s, cambio largo a la banda derecha, pase atr\xE1s raso y remate de primeras","Ataque elaborado"],["1-1 (32', penalti)","P\xE9rdida en campo rival, contra a la espalda de un lateral adelantado y mano al tapar un tiro","Transici\xF3n defensiva"],["2-1 (47')","Saque largo desde porter\xEDa a la banda derecha, conducci\xF3n, recorte y tiro raso","Ataque directo"],["3-1 (50')","Centro desde la izquierda despejado; media volea de primeras desde fuera del \xE1rea","Segunda l\xEDnea"],["4-1 (78')","Contra de 10 segundos desde nuestro tercio: robo por la izquierda, cambio a la derecha, centro y cabezazo","Transici\xF3n ofensiva"]]}),(0,u.jsx)(B,{children:"Fuente: c\xE1mara amplia de Esport+. Tras el descanso el Prat tuvo varias faltas laterales que la defensa despej\xF3 bien de cabeza."})]})]}),(0,u.jsxs)(j,{heading:"Plan para ganar la liga",id:"plan",children:[(0,u.jsx)(B,{children:"Con 4 puntos de desventaja hay que ganar casi todo y sumar contra Martorell, San Mauro y Cornell\xE0. Con el entrenador actual el equipo va 4 de 4; el margen de mejora est\xE1 en los primeros 20 minutos y en la defensa del \xE1rea."}),(0,u.jsx)(Va,{steps:[{title:"Salir activados",detail:"Calentamiento intenso y primeros 20 minutos sin riesgos en la salida: es cuando encajamos."},{title:"Contra rivales que dejan jugar, mantener el plan",detail:"Presi\xF3n alta, posesi\xF3n y volumen de tiros."},{title:"Contra rivales que presionan, plan B de salida",detail:"Salida en largo y pelea por la segunda jugada, con las l\xEDneas juntas para recoger el rechace."},{title:"Vigilancia defensiva y rechaces",detail:"Los dos centrales y el pivote detr\xE1s del bal\xF3n; tras cada tiro a nuestra porter\xEDa, dos jugadores atacan el rechace."},{title:"Gestionar las ventajas",detail:"No encerrarse: mantener una salida por banda o en largo y al menos un 40 % de posesi\xF3n."},{title:"Bal\xF3n parado como arma",detail:"Cada falta lateral y cada c\xF3rner, una ocasi\xF3n preparada con movimientos ensayados."}]})]}),(0,u.jsx)(j,{heading:"Recomendaciones de equipo",id:"recomendaciones",children:(0,u.jsx)($n,{items:["Primeros 20 minutos: salida en largo si el rival presiona, l\xEDneas juntas y cero p\xE9rdidas en campo propio. 6 de los 9 goles en contra llegaron ah\xED.","Plan B contra presi\xF3n alta: si el rival presiona con 3 o m\xE1s arriba o roba 2 salidas seguidas, salida en largo a una banda y el centro del campo cierra la segunda jugada.","Salida de 3: el pivote se mete entre los centrales y los laterales se abren, para tener siempre un pase libre.","Vigilancia defensiva: al atacar, los dos centrales y el pivote nunca pasan del centro del campo a la vez.","Regla del rechace: tras cada tiro a nuestra porter\xEDa, los dos jugadores m\xE1s cercanos atacan el \xE1rea peque\xF1a y el centro del campo sigue a quien llega desde atr\xE1s. En ataque, igual: dos jugadores siguen cada tiro a puerta.","Defender sin falta dentro del \xE1rea: dos penaltis en contra en nueve partidos. Al tapar un tiro, brazos pegados al cuerpo o a la espalda.","Pases en el medio: nada de pases previsibles en campo rival con un lateral adelantado; si no hay l\xEDnea clara, atr\xE1s y cambiar de orientaci\xF3n.","Presi\xF3n tras p\xE9rdida de 5 segundos; si no se recupera, repliegue en 4-1-4-1. La presi\xF3n al portero rival ya dio un gol (J4).","Usar las dos bandas: cambios de orientaci\xF3n largos hacia el lado d\xE9bil, como en tres de los goles contra el Prat.","Con ventaja, mantener al menos un 40 % de posesi\xF3n: una salida por banda o en largo en vez de despejar.","Bal\xF3n parado ofensivo: en cada falta lateral y cada c\xF3rner, centro cerrado al punto de penalti con tres rematadores atacando esa zona y uno al rechace. Es nuestra v\xEDa de gol m\xE1s repetida en los v\xEDdeos (al menos 5 goles).","Defensa de los rechaces tras
