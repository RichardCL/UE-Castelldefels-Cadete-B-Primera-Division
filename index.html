<style>/* Identidad visual: azul y amarillo de la UE Castelldefels */
:root{--navy:#00007E;--navy-d:#000058;--navy-t:#E8EAF8;--yel:#FFFF1A;--yel-ui:#F5D000;--yel-t:#FFF9C4;--red:#D7262E;
  --ink:#14163A;--mut:#5A5D78;--bd:#DCDDEA;--bg:#F3F4FA}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
.page{max-width:900px;margin:0 auto;padding:0 16px 40px}
a{color:var(--navy)}
/* Cabecera */
.hero{background:radial-gradient(120% 140% at 100% 0%,#1a1aa8 0%,var(--navy) 45%,var(--navy-d) 100%);color:#fff;margin:0 -16px 22px;padding:24px 22px 22px;position:relative;border-bottom:6px solid var(--yel)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.crest{width:64px;height:64px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.club{color:var(--yel);font-weight:800;font-size:22px;letter-spacing:.3px;line-height:1.1;text-transform:uppercase}
.team{color:#D6D9F5;font-size:14px;font-weight:500;margin-top:3px}
.hero h1{margin:4px 0 8px;font-size:clamp(22px,4.4vw,31px);line-height:1.18;font-weight:750;letter-spacing:-.2px}
.summary{color:#D6D9F5;margin:0 0 16px;max-width:760px}
.downloads{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;text-decoration:none;font-weight:700;font-family:inherit}
.btn.primary{background:var(--yel);border-color:var(--yel);color:var(--navy)}
.hero .btn.primary{box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:hover{filter:brightness(.96)}
.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--yel-ui);outline-offset:2px}
/* Secciones */
.sec{scroll-margin-top:12px}
.sec.d0{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:20px 20px 8px;margin:0 0 18px;box-shadow:0 1px 2px rgba(0,0,40,.04)}
.sec.d1,.sec.d2{margin:20px 0 6px}
.sechead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h2.h{font-size:21px;margin:0;color:var(--navy);font-weight:780;letter-spacing:-.2px;padding-bottom:4px;background:linear-gradient(var(--yel-ui),var(--yel-ui)) left bottom/44px 4px no-repeat}
h3.h{font-size:17px;margin:0;color:var(--navy);font-weight:700}
.chev{display:inline-block;width:18px;color:var(--mut)}
.caption{color:var(--mut);font-size:13.5px;margin:-2px 0 10px}
.blocks>*{margin:0 0 14px}
.text{margin:0 0 12px}
.callout{background:var(--yel-t);border-left:5px solid var(--yel-ui);padding:12px 14px;border-radius:10px}
.callout strong{display:block;margin-bottom:4px;color:var(--navy)}
/* Tablas */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--bd)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:650;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #EEF0F6;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:#F8F9FD}
td.em{font-weight:650;color:var(--navy)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;margin-left:6px;background:var(--navy-t);color:var(--navy)}
td .pill{margin-left:0}
.pill.success{background:#DDF2E1;color:#1B5E20}.pill.warning{background:#FFF3B8;color:#6B5200}.pill.danger{background:#F9D6D9;color:#8E0F1E}
/* Fichas y filas */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;border:1px solid var(--bd);border-left:4px solid var(--yel-ui);border-radius:10px;padding:10px 12px;background:#fff}
.lead{flex:0 0 auto;min-width:38px;height:38px;border-radius:19px;background:var(--navy);color:var(--yel);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0 6px}
.rbody{flex:1;min-width:0}.rtitle{font-weight:680;color:var(--ink)}.rmeta{color:var(--mut);font-size:13px}.rdetail{font-size:14.5px;margin-top:2px}
.list{margin:0 0 12px;padding-left:22px}.list li{margin:0 0 6px}.list li::marker{color:var(--navy);font-weight:700}
.list.pro li::marker{content:"+  ";color:#1B7F3B}.list.con li::marker{content:"−  ";color:var(--red)}
.steps{list-style:none;padding:0;margin:0}.steps li{display:flex;gap:10px;margin:0 0 10px}
.steps .n{flex:0 0 26px;height:26px;border-radius:13px;background:var(--navy);color:var(--yel);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.steps b{color:var(--navy)}.sd{color:#33354F;font-size:14.5px}
.props{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:6px 14px;margin:0}
.props dt{font-weight:650;color:var(--navy)}.props dd{margin:0}
/* Indicadores */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric{border:1px solid var(--bd);border-top:5px solid var(--yel-ui);border-radius:12px;padding:12px 14px;background:linear-gradient(180deg,#fff 0%,#FAFAFE 100%)}
.mv{font-size:28px;font-weight:800;line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums}.ml{font-weight:650;font-size:14px}.md{color:var(--mut);font-size:13px}
/* Índice */
.toc{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px 20px;margin:0 0 18px}
.toct{font-weight:780;margin-bottom:6px;color:var(--navy)}.toc ol{margin:0;padding-left:22px;columns:2;column-gap:28px}.toc li{margin:0 0 4px;break-inside:avoid}
.toc li::marker{color:var(--mut)}.toc li.sub{list-style:circle;margin-left:14px}.toc a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--bd)}.toc a:hover{color:var(--navy);border-color:var(--yel-ui)}
/* Pestañas */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--navy-t);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--navy);font-family:inherit;font-weight:600}
.seg button.on{background:var(--navy);color:var(--yel);box-shadow:0 1px 3px rgba(0,0,60,.25)}
/* Rejilla y gráficos */
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px}
.grid>.sec{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0;background:#fff}
.proscons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pc{border:1px solid var(--bd);border-radius:12px;padding:12px}
.pc b{color:var(--navy)}.pc.pro{border-top:4px solid #2E7D32}.pc.con{border-top:4px solid var(--red)}.pc ul{margin-top:6px}
.bars{display:flex;flex-direction:column;gap:8px}
.bl{font-size:14px;font-weight:650}.bm{font-weight:400;color:var(--mut);font-size:12.5px;margin-left:6px}
.bt{display:flex;align-items:center;gap:8px}.bf{height:14px;background:linear-gradient(90deg,var(--navy),#2B2BB0);border-radius:7px;min-width:4px}.bd{font-size:13px;font-weight:700;white-space:nowrap;color:var(--navy)}
.bar:hover .bf{background:var(--yel-ui)}
.chart .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-bottom:4px}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg{max-width:620px;display:block}
svg text{font-family:inherit}
.sec.d1>.blocks{overflow-x:auto}
.blocks>svg[aria-label^="Resultados"]{min-width:540px}
/* Pie */
.foot{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mut);font-size:13px;padding:18px 0 8px;border-top:3px solid var(--yel-ui);margin-top:10px}
.foot img{width:28px;height:28px}
@media (max-width:700px){.grid,.proscons{grid-template-columns:1fr}.toc ol{columns:1}.sec.d0{padding:16px 13px 4px}body{font-size:15px}
  .props{grid-template-columns:1fr}.props dt{margin-top:6px}.crest{width:52px;height:52px}.club{font-size:18px}.hero{padding:20px 16px 18px}}
@media print{.downloads,.seg{display:none}.hero{background:var(--navy)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head>

nsa despej\xF3 bien de cabeza."})]}),(0,p.jsx)(T,{heading:"Goles del v\xEDdeo cuadrados con el acta",children:(0,p.jsx)(dr,{rows:[{lead:"J4",title:"Gerard 4': presi\xF3n al portero, bal\xF3n suelto y tiro a puerta vac\xEDa",detail:"Aparece a los 17 minutos de la grabaci\xF3n de la primera parte, as\xED que el v\xEDdeo va unos 13 minutos por delante del acta. Pero el 1-1 del minuto 5 no se ve justo despu\xE9s, y el gol del Vilafranca que el v\xEDdeo muestra est\xE1 en la grabaci\xF3n de la segunda parte, cuando el acta pone los dos antes del descanso (5' y 39'). La l\xEDnea de tiempo de J4 no cuadra; sus detalles son poco fiables.",status:{label:"Parcial",tone:"warning"}},{lead:"J6",title:"Hugo Pineda 2': gol a los 15 minutos de grabaci\xF3n",detail:"Cuadra con el desfase de unos 13 minutos. La grabaci\xF3n larga lo describe como un disparo bombeado desde fuera del \xE1rea; los clips del partido muestran un pase atr\xE1s raso desde la derecha y remate de primeras. Las dos descripciones no coinciden.",status:{label:"Cuadra (minuto)",tone:"success"}},{lead:"J6",title:"Cornell\xE0 10' de penalti",detail:"El v\xEDdeo ve, 9 minutos despu\xE9s de nuestro gol, una p\xE9rdida en el medio y un pase entre los centrales: es la jugada del penalti, aunque el an\xE1lisis no vio la falta. El gol de Eidan del 27' cae fuera de la grabaci\xF3n.",status:{label:"Cuadra",tone:"success"}},{lead:"J6",title:"Descartado: supuesto gol nuestro en la segunda parte",detail:"El acta no recoge ning\xFAn gol tras el descanso.",status:{label:"Descartado",tone:"danger"}},{lead:"J7",title:"Blanca Subur 20': gol de rechace tras una parada",detail:"A los 21 minutos de grabaci\xF3n: esta parte casi coincide con el acta.",status:{label:"Cuadra",tone:"success"}},{lead:"J7",title:"Bruno 80': bal\xF3n largo que bota y 1 contra 1",detail:"Al final de la grabaci\xF3n. Los goles de Edgar (56' y 69') no est\xE1n grabados.",status:{label:"Cuadra",tone:"success"}},{lead:"J2",title:"6 de los 8 goles vistos",detail:"El orden del v\xEDdeo cuadra con el acta en el 1-0 de Bruno (11') y en los dos goles de Carles a bal\xF3n parado (23' y 45'). El v\xEDdeo tambi\xE9n muestra un penalti provocado por el extremo izquierdo, sin autor confirmado.",status:{label:"Cuadra",tone:"success"}}]})})]}),(0,p.jsx)(T,{heading:"Patrones clave",id:"patrones",children:(0,p.jsx)(fr,{items:["Salidas fr\xEDas: 6 de los 9 goles en contra llegan antes del 20'.","Segundas partes fuertes: 14 goles a favor y 1 en contra tras el descanso.","Contra rivales que dejan jugar, presi\xF3n alta y 70-80 % de posesi\xF3n: el equipo arrasa (J2, 21 tiros a 6).","Contra presi\xF3n alta, la salida en corto se rompe: saques de puerta interceptados y balonazos sin destino (J7 primera parte, final de J4).","Los goles en contra vistos nacen de p\xE9rdidas en el medio (J4, J5, J6) y de rechaces mal defendidos; adem\xE1s, 2 penaltis cometidos.","En los clips de partidos en casa contra rivales de camiseta blanca (partido concreto sin confirmar): muchas ocasiones nacen de centros y pases atr\xE1s rasos desde la derecha, dos goles llegan de rechaces tras parada del portero rival y otros de una conducci\xF3n por la izquierda con centro raso.","El bal\xF3n parado lateral es una fuente repetida de gol: en los v\xEDdeos se ven al menos 4 goles de falta lateral o c\xF3rner, con centro cerrado de pierna derecha y remate, casi siempre de cabeza, alrededor del punto de penalti. Dos son contra un rival de azul claro; en Cubelles, Carles marc\xF3 de cabeza tras una falta lateral de Bruno y de c\xF3rner botado por David.","En los goles en juego de Cubelles se repiten el pase atr\xE1s raso desde la derecha con remate de primeras y un bal\xF3n largo por encima de la defensa hacia la derecha; tambi\xE9n se ve una jugada de izquierda a derecha con pase atr\xE1s y tiro parado.","El bal\xF3n parado defensivo funciona: los c\xF3rners en J6 y las faltas laterales del Prat en J5 se despejaron bien.","Variedad de gol: salida elaborada (J5 1-0), saque largo del portero (J5 2-1), disparo lejano (J5 3-1) y contra de 10 segundos (J5 4-1).","Con ventaja, el equipo se encierra demasiado: 30-35 % de posesi\xF3n al final de J2 y 15-20 % al final de J6.","La dependencia de la izquierda es menos clara de lo que parec\xEDa: en J2, J4 y J7 domina el lado izquierdo, pero contra el Prat 3 de 4 goles llegaron por la derecha y Hugo Pineda marc\xF3 en Cornell\xE0."]})}),(0,p.jsxs)(T,{heading:"Fichas por jugador",id:"fichas",children:[(0,p.jsx)(pr,{options:[{value:"defensa",label:"Porteros y defensa"},{value:"medio",label:"Centro del campo"},{value:"ataque",label:"Ataque"}],value:e,onChange:n}),(0,p.jsx)(dr,{rows:qp[e]})]}),(0,p.jsxs)(T,{heading:"Sistema y propuesta de once seg\xFAn rendimiento",id:"once",caption:"C\xEDrculo relleno: posici\xF3n vista en el v\xEDdeo. Discontinuo: posici\xF3n no verificada (colocaci\xF3n propuesta).",children:[(0,p.jsx)(Al,{lead:"Los 17 jugadores son igual de importantes.",children:"Esta propuesta no es una jerarqu\xEDa: sale del rendimiento analizado en las actas y los v\xEDdeos hasta J8, los puestos rotan y cambiar\xE1 seg\xFAn lo que muestre cada jornada. Cada jugador figura en al menos un puesto."}),(0,p.jsx)($p,{}),(0,p.jsx)(An,{items:[{label:"Con bal\xF3n",value:"4-3-3 / 4-2-3-1, la forma vista en el v\xEDdeo (J6, J7): David por delante de los centrales"},{label:"Sin bal\xF3n",value:"4-4-2 o 4-1-4-1 en bloque medio (v\xEDdeo de J4, J6 y J7)"},{label:"Posici\xF3n vista en v\xEDdeo",value:"David (pivote, J2), Hugo Pineda (extremo derecho, J5) y Nicol\xE1s (lateral derecho, J4)"},{label:"Posici\xF3n no verificada",value:"Resto de la propuesta: colocaci\xF3n a partir de partidos de inicio y goles de las actas"}]}),(0,p.jsx)(q,{children:"La propuesta sale del rendimiento recogido en las actas (partidos de inicio y goles) y en los v\xEDdeos. Edgar lleva una racha goleadora (6 goles en actas en 7 partidos, 2 tras entrar en J7) que le sit\xFAa como opci\xF3n de inicio en delantero centro. Gerard (5 goles) y Bruno (3 goles y 3 asistencias) tambi\xE9n aportan mucha producci\xF3n; Eidan y Gerard pueden repartirse el extremo izquierdo: Gerard suma goles y el extremo izquierdo identificado como Eidan aporta desborde en el v\xEDdeo. Las actas no recogen posiciones: solo David, Hugo Pineda y Nicol\xE1s tienen su puesto visto en el v\xEDdeo."}),(0,p.jsx)(T,{heading:"Puestos compartidos y papeles",children:(0,p.jsx)(dr,{rows:[{lead:"18 / 17",title:"Gerard o Eidan",detail:"Puesto compartido: quien no empiece entra hacia el minuto 40-50."},{lead:"13 / 1",title:"Marc o Axel",detail:"Rendimiento parecido en las cifras (Axel 1 gol encajado por partido, Marc 1,3). Elegir por forma en los entrenamientos."},{lead:"6 / 8",title:"Carles o Mart\xED",detail:"Dos opciones para el mismo puesto: Carles aporta remate en el bal\xF3n parado (2 goles en J2) y Mart\xED, opciones en el medio (centrocampista en el v\xEDdeo del Prat)."},{lead:"14",title:"Eric Pardo",detail:"Opci\xF3n en el lateral derecho y en el interior derecho, donde jug\xF3 en J4."},{lead:"3 / 12",title:"Hugo D\xEDaz y Eloy",detail:"Hugo D\xEDaz, opci\xF3n en central y lateral derecho (4 partidos de inicio); Eloy, opci\xF3n en punta y extremo. Darles minutos permite valorar su rendimiento: las actas a\xFAn no registran minutos de Eloy."}]})}),(0,p.jsx)(T,{heading:"Opciones por puesto: toda la plantilla",caption:"Los 17 jugadores de las actas J1-J8, cada uno en al menos un puesto. Propuesta revisable cada jornada seg\xFAn rendimiento. Solo David, Hugo Pineda, Nicol\xE1s, Mart\xED, Eric y Gerard tienen puesto visto en el v\xEDdeo; el resto es colocaci\xF3n propuesta.",children:(0,p.jsx)(de,{columns:["Puesto","Propuesta actual","Otras opciones en el puesto"],rows:[["Portero","1 Axel","13 Marc"],["Lateral derecho","21 Nicol\xE1s","14 Eric Pardo, 3 Hugo D\xEDaz"],["Central","8 Mart\xED / 6 Carles","3 Hugo D\xEDaz"],["Central","22 Gonzalo","3 Hugo D\xEDaz, 6 Carles"],["Lateral izquierdo","16 Jan","Por definir con m\xE1s datos de actas y v\xEDdeo"],["Pivote","10 David","8 Mart\xED"],["Interior derecho","11 Joan","14 Eric Pardo (interior derecho en J4)"],["Interior izquierdo","19 Bruno","8 Mart\xED"],["Extremo derecho","7 Hugo Pineda","18 Gerard, 21 Nicol\xE1s (extremo tras entrar en J7)"],["Delantero centro","9 Edgar","18 Gerard, 12 Eloy"],["Extremo izquierdo","17 Eidan / 18 Gerard","12 Eloy"]]})})]}),(0,p.jsxs)(T,{heading:"Reparto orientativo de minutos",id:"minutos",caption:"Seg\xFAn el rendimiento analizado hasta J8; se revisa cada jornada.",children:[(0,p.jsx)(de,{columns:["Situaci\xF3n actual","Jugadores","Minutos"],rows:[["M\xE1s continuidad hasta ahora","Gonzalo, David, Bruno, Edgar, Hugo Pineda, Nicol\xE1s, Jan","60-80"],["Puesto compartido","Eidan y Gerard","40-60 cada uno"],["Puestos con opciones abiertas","Mart\xED, Carles, Joan, porteros","50-80"],["Sumar minutos para valorar rendimiento","Eric, Hugo D\xEDaz, Eloy","20-40"]]}),(0,p.jsx)(q,{children:"Todos los jugadores son igual de importantes: el reparto depende del rendimiento en actas y v\xEDdeos y cambia con \xE9l. Bruno lleva 3 amarillas: conviene controlar las tarjetas de todos para no perder jugadores por sanci\xF3n."})]}),(0,p.jsxs)(T,{heading:"Plan para ganar la liga",id:"plan",children:[(0,p.jsx)(q,{children:"Con 4 puntos de desventaja hay que ganar casi todo y sumar contra Martorell, San Mauro y Cornell\xE0. Con Javier Guerrero el equipo va 3 de 3; el margen de mejora est\xE1 en los primeros 20 minutos y en la defensa del \xE1rea."}),(0,p.jsx)(di,{steps:[{title:"Salir activados",detail:"Calentamiento intenso y primeros 20 minutos sin riesgos en la salida: es cuando encajamos."},{title:"Contra rivales que dejan jugar, mantener el plan",detail:"Presi\xF3n alta, posesi\xF3n y volumen de tiros."},{title:"Contra rivales que presionan, plan B de salida",detail:"Salida en largo hacia la izquierda y pelea por la segunda jugada, con Edgar fijando a los centrales."},{title:"Vigilancia defensiva y rechaces",detail:"Los dos centrales y el pivote detr\xE1s del bal\xF3n; tras cada tiro a nuestra porter\xEDa, dos jugadores atacan el rechace."},{title:"Gestionar las ventajas",detail:"No encerrarse: un bal\xF3n a Edgar o al extremo para respirar."}]})]}),(0,p.jsx)(T,{heading:"Instrucciones para el entrenador",id:"instrucciones",children:(0,p.jsx)(fr,{items:["Seg\xFAn el rendimiento analizado: Edgar lleva una racha goleadora (6 goles en 7 partidos, 2 tras entrar en J7) que le sit\xFAa como opci\xF3n de inicio en la delantera; Bruno (3 goles y 3 asistencias) y Gerard (5 goles, 40-60 minutos como referencia) aportan producci\xF3n. Propuesta revisable cada jornada.","Primeros 20 minutos: salida en largo si el rival presiona, l\xEDneas juntas y cero p\xE9rdidas en campo propio. 6 de los 9 goles en contra llegaron ah\xED.","Plan B contra presi\xF3n alta: si el rival presiona con 3 o m\xE1s arriba o roba 2 salidas seguidas, el portero saca en largo a la izquierda y los interiores cierran la segunda jugada.","Salida de 3: David se mete entre los centrales y los laterales se abren, para tener siempre un pase libre.","Vigilancia defensiva: al atacar, los dos centrales y el pivote nunca pasan del centro del campo a la vez.","Regla del rechace: tras cada tiro a nuestro portero, los dos m\xE1s cercanos atacan el \xE1rea peque\xF1a y los medios siguen a quien llega desde atr\xE1s. En ataque, igual: dos jugadores siguen cada tiro a puerta (en los clips hay goles de rechace).","Defender sin falta dentro del \xE1rea: dos penaltis en contra en ocho partidos. Al tapar un tiro, brazos pegados al cuerpo o a la espalda (el penalti del Prat fue por mano con el brazo separado).","Pases en el medio: nada de pases previsibles en campo rival con el lateral izquierdo adelantado; si no hay l\xEDnea clara, atr\xE1s y cambiar de orientaci\xF3n.","Presi\xF3n tras p\xE9rdida de 5 segundos; si no se recupera, repliegue en 4-1-4-1. La presi\xF3n al portero dio el gol de Gerard en J4.","Repartir minutos entre Eidan y Gerard (40-60 minutos cada uno) y alimentar la derecha: cambios largos de los centrales y del portero hacia Hugo Pineda, como en tres de los goles contra el Prat.","Con ventaja, mantener al menos un 40 % de posesi\xF3n: una salida al delantero o al extremo en vez de despejar.","Bal\xF3n parado ofensivo: en cada falta lateral y cada c\xF3rner, centro cerrado al punto de penalti con tres rematadores atacando esa zona y uno al rechace. Es nuestra v\xEDa de gol m\xE1s repetida en los v\xEDdeos (al menos 4 goles, 2 de ellos de Carles en Cubelles).","Porteros: trabajar el desv\xEDo hacia fuera y no al centro (el 0-1 de J7).","Controlar las amarillas de Bruno (3) y anotar los cambios con su minuto en cada partido."]})}),(0,p.jsx)(T,{heading:"M\xE9todo y limitaciones",id:"metodo",children:(0,p.jsx)(cr,{items:["Fuentes: actas oficiales de la FCF de J1-J8 (alineaciones, goles con minuto, tarjetas, capitanes y entrenador), ranking de goleadores de la FCF tras J8 y clasificaci\xF3n de la FCF; v\xEDdeos de los partidos de J2, J4, J6 y J7; clips de la c\xE1mara amplia de Esport+ del partido contra el Prat (J5); clips cortos de J2 (Cubelles), J6, partidos en casa contra rivales de blanco y un partido contra un rival de azul claro (sin audio o sin partido identificado: solo se usan para patrones y descripciones de jugadas).","Las actas no muestran cambios, posiciones ni asistencias. Los minutos son estimaciones y las asistencias salen solo del v\xEDdeo.","Acta de J2 (Cubelles 1-8, 03/10/2026): goles, minutos y tarjetas tomados del acta en la app de la FCF; en la web el acta muestra la alineaci\xF3n pero no los goles. Sus goles cuadran con el ranking de goleadores de la FCF.","8 v\xEDdeos (4 partidos \xD7 2 partes) de 24 a 28 minutos, revisados en tramos de 10 minutos. Los dorsales casi nunca se leen; muchos jugadores se identifican por zona y alineaci\xF3n, y esas identificaciones se marcan como probables.","En J4 y J6 la grabaci\xF3n de la primera parte va unos 13 minutos por delante del ac
